<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Site Moved</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 600px;
            margin: 20px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 30px;
            color: #667eea;
        }
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 20px;
            font-weight: 300;
        }
        p {
            color: #666;
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .new-url {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin: 30px 0;
            border-left: 4px solid #667eea;
        }
        .new-url a {
            color: #667eea;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
        }
        .new-url a:hover {
            text-decoration: underline;
        }
        .redirect-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.3s ease;
        }
        .redirect-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }
        .redirect-message {
            margin-top: 30px;
            color: #999;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🚀</div>
        <h1>Site Moved</h1>
        <p>Thank you for visiting our website! We have moved to a new address to provide you with a better experience.</p>

        <div class="new-url">
            <p><strong>New URL:</strong></p>
            <a href="https://cjeen.github.io/LoRAEdit/" target="_blank">https://cjeen.github.io/LoRAEdit/</a>
        </div>

        <a href="https://cjeen.github.io/LoRAEdit/" class="redirect-btn">Visit New Site</a>

        <div class="redirect-message">
            <p>Redirecting you to the new site now...</p>
        </div>
    </div>

    <script>
        // Immediate redirect
        window.location.href = 'https://cjeen.github.io/LoRAEdit/';
    </script>
</body>
</html>
